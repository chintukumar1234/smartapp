<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juice Shop 🍹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          deep: '#061a10',
          mid: '#0a2617',
          green: { soft: '#4ade80', DEFAULT: '#22c55e' },
          lime: '#a3e635',
        },
        fontFamily: {
          serif: ['"Cormorant Garamond"', 'serif'],
          sans: ['"DM Sans"', 'sans-serif'],
        },
      }
    }
  }
</script>
<style>
  /* Shimmer keyframes aren't expressible as plain Tailwind utilities, kept minimal */
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  .shimmer {
    background-image: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 800px 100%;
    animation: shimmer 1.6s infinite linear;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: translateY(0); } }
  .card-in { animation: fadeUp 0.4s cubic-bezier(0.4,0,0.2,1) both; }
</style>
</head>
<body class="min-h-screen bg-deep text-[#e8f5ee] font-sans">

<!-- background wash -->
<div class="fixed inset-0 -z-10 pointer-events-none"
     style="background:
       radial-gradient(ellipse 60% 50% at 80% 10%, rgba(34,197,94,0.12) 0%, transparent 60%),
       radial-gradient(ellipse 50% 60% at 10% 80%, rgba(163,230,53,0.08) 0%, transparent 55%),
       linear-gradient(160deg, #061a10 0%, #0a2617 50%, #061a10 100%);"></div>

<!-- NAV -->
<nav class="sticky top-0 z-10 flex items-center justify-between h-16 px-[6%] bg-deep/85 backdrop-blur-md border-b border-white/10">
  <a href="#" class="flex items-center gap-2.5 no-underline">
    <span class="font-serif text-xl font-semibold tracking-tight">Fresh<em class="not-italic italic text-green-soft">Mart</em></span>
  </a>

  <ul class="hidden sm:flex items-center gap-1.5 list-none">
    <li><a href="#" class="text-sm text-green-soft px-3 py-1.5 rounded-lg">Shop</a></li>
    <li><a href="#" class="text-sm text-white/45 hover:text-[#e8f5ee] hover:bg-white/[0.09] px-3 py-1.5 rounded-lg transition-colors">Bundles</a></li>
    <li><a href="#" class="text-sm text-white/45 hover:text-[#e8f5ee] hover:bg-white/[0.09] px-3 py-1.5 rounded-lg transition-colors">About</a></li>
    <li><a href="#" class="text-sm text-white/45 hover:text-[#e8f5ee] hover:bg-white/[0.09] px-3 py-1.5 rounded-lg transition-colors">Contact</a></li>
  </ul>

  <div class="flex items-center gap-2.5">
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-white/45 pointer-events-none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search juices…"
        class="w-40 sm:w-56 h-9 bg-white/5 border border-white/10 rounded-full text-[#e8f5ee] placeholder-white/45 pl-9 pr-3.5 text-sm outline-none focus:border-green/40 focus:ring-4 focus:ring-green/10 transition-colors" />
    </div>
    <div title="Account" class="w-[34px] h-[34px] rounded-full bg-white/5 border border-white/10 hover:border-green/30 hover:text-green-soft flex items-center justify-center text-sm font-medium text-white/45 cursor-pointer transition-colors">U</div>
  </div>
</nav>
<br>
<!-- GRID -->
<div id="productContainer"
     class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5 max-w-[1400px] mx-auto px-[6%] pb-16 p-59">
  <!-- skeletons injected here, replaced by JS -->
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-20 bg-green text-black px-5 py-2.5 rounded-full text-[13px] font-medium shadow-[0_8px_24px_rgba(34,197,94,0.4)] pointer-events-none whitespace-nowrap transition-transform duration-300 z-[999]"></div>

<footer class="text-center py-5 text-xs text-white/45 border-t border-white/10">© 2026 FreshMart · All rights reserved</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVWLIDjsmMcH2kfqiKwQ1-jFU6d6654pY",
  authDomain: "myproject-fdb4c.firebaseapp.com",
  databaseURL: "https://myproject-fdb4c-default-rtdb.firebaseio.com",
  projectId: "myproject-fdb4c",
  storageBucket: "myproject-fdb4c.firebasestorage.app",
  messagingSenderId: "600134367178",
  appId: "1:600134367178:web:ea8b0daa3928c7791c8133"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const container = document.getElementById("productContainer");
const searchInput = document.getElementById("searchInput");

let allProducts = [];

function randomRating() {
  return (3.8 + Math.random() * 1.2).toFixed(1);
}

function renderSkeletons(n = 8) {
  container.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div");
    s.className = "rounded-[20px] bg-white/5 border border-white/10 overflow-hidden";
    s.innerHTML = `
      <div class="h-[150px] shimmer" style="animation-delay:${i * 0.15}s"></div>
      <div class="p-3.5 flex flex-col gap-2">
        <div class="h-3 rounded-md shimmer" style="animation-delay:${i * 0.15}s"></div>
        <div class="h-3 w-[55%] rounded-md shimmer" style="animation-delay:${i * 0.15}s"></div>
      </div>`;
    container.appendChild(s);
  }
}

function renderCards(products) {
  container.innerHTML = "";

  if (!products.length) {
    container.innerHTML = `
      <div class="col-span-full text-center py-16 px-5 text-white/45">
        <svg class="mx-auto mb-4 opacity-40" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <p class="text-[15px]">No items match your search.</p>
      </div>`;
    return;
  }

  products.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "group relative rounded-[5px] bg-white/5 border border-white/10 overflow-hidden cursor-pointer transition-all duration-300 ease-out hover:-translate-y-1.5 hover:shadow-[0_24px_48px_rgba(0,0,0,0.5)] hover:border-green/25 card-in";
    card.style.animationDelay = `${i * 0.05}s`;
    card.innerHTML = `
      <div class="relative h-[150px] overflow-hidden">
        <img src="${p.a}" alt="${p.b}" loading="lazy"
             class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.06]" />
        <div class="absolute inset-0 bg-gradient-to-t from-deep/70 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

        <div class="absolute top-2.5 left-2.5 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-[2]">
          <button title="Add to wishlist" aria-label="add to wishlist"
            class="w-7 h-7 rounded-full bg-black/40 backdrop-blur-sm border border-white/15 flex items-center justify-center text-white hover:bg-black/60 transition-colors">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
        </div>

      </div>
      <div class="p-3 pb-3.5">
        <h3 class="text-sm font-medium leading-tight truncate">${p.b}</h3>
        <div class="flex items-center justify-between mt-2">
          <div class="font-serif text-lg font-semibold text-green-soft tracking-tight">₹${p.c}</div>
          <div class="flex items-center gap-1 text-[11px] text-white/45"><span class="text-amber-400 text-[11px]">★</span>${p._rating}</div>
        </div>
      </div>`;

    card.addEventListener("click", () => {
      sessionStorage.setItem("selectedProduct", JSON.stringify(p));
      window.location.href = `final.html`;
    });

    container.appendChild(card);
  });
}

function getFiltered() {
  const q = searchInput.value.trim().toLowerCase();
  return allProducts.filter(p => p.b.toLowerCase().includes(q));
}

searchInput.addEventListener("input", () => renderCards(getFiltered()));

renderSkeletons();

onValue(ref(db, 'user'), snapshot => {
  allProducts = [];
  snapshot.forEach(child => {
    const p = child.val();
    p._rating = randomRating();
    allProducts.push(p);
  });
  renderCards(getFiltered());
});

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("translate-y-20");
  t.classList.add("translate-y-0");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove("translate-y-0");
    t.classList.add("translate-y-20");
  }, 2200);
}
</script>
</body>
</html>
